<body>
    <header>
        <h1>Header</h1>

    <main>
        <!-- <h3>Main</h3> -->
        <form>
            <!-- <fieldset>
                <legend>Contact Information</legend>
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
                <label for="useremail">Email:</label>

            <fieldset>
                <legend>Contact Information</legend>
                    
                    <div class="form-item column2">
                        <label>Full Name: <input type="text" name="fullname"></label>
                    </div>

                    <div class="form-item" column2>
                        <label>Email: <input type="email" name="useremail"></label>
                    </div>

            </fieldset>
            <fieldset>
                <legend>Questions</legend>
                <div id="form-item column1"><label for="browser">What is your favorite internet browser?</labe>
                    <select id="browser" name="browser">
                        <option value="chrome">Chrome</option>
                        <option value="firefox">Firefox</option>
                        <option value="safari">Safari</option>
                        <option value="edge">Edge</option>
                        <option value="brave">Opera</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div id="form-item column1>">
                    <label for="pet">Do you have a household pet?</label>
                    <input type="checkbox" id="pet" name="pet" value="yes">
                    <label for="feedback">List the places you have lived:</label>
                    <textarea id="feedback" name="feedback" rows="4" placeholder="Stillwater Florida, Amsterdam Netherlands, Tibuktu Mali"></textarea>
                </div>    
            </fieldset>
            <button type="submit">Submit Poll</button>
        </form>
    </main>
