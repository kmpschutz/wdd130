        <div id="navDiv">

    <main>
        <div id="contactMainDiv01">

            <div id="contactMainDiv01LeftSpan" class="contactTopSpans">
                <section>
                    <h3>Water Rafting</h3><br>
                    <h5><span>Address:</span> Takoronga Main Street, Betio.</h5><br>
                    <h5><span>Phone Number:</span>+686 75126187 ext: 242</h5><br>
                    <h5><span>Email:</span>info@police.gov.ki</h5>

                </section>
            </div>
            <div id="contactMainDiv01CenterSpan" class="contactTopSpans">
                <!-- <section>This is a place holder for the center div</section> -->
                <form>
                    <fieldset>
                        <!-- <label>Full Name: <input type="text" name="fullname"></label>
                             <label>Email: <input type="email" id="useremail" name="useremail"></label> -->
                        <label for="fullname">Full Name: </label>
                        <input type="text" id="fullname" name="fullname" required><br>
                        <label for="email">Email: </label>
                        <input type="email" id="email" name="user_email" required><br>
                        <label><input type="radio" id="general.enquiry" name="enquiry_type">General Enquiry</label>
                        <label><input type="radio" id="reservation.question" name="enquiry_type">Reservation
                            Question</label>
                        <label><input type="radio" id="website.suggestion" name="enquiry_type">Website
                            Suggestion</label>
                        <!-- <input type="textarea" id="message" name="message"><br> -->
                        <textarea id="message" name="message" rows="5" cols="30"></textarea>

                        <label><input type="checkbox" id="subscribe" name="subscribe" value="yes">Please subscribe me to
                            the monthly newsletter.</label>
                        <input type="submit" value="Send Message" id="SubmitButton"
                            style="display: block; margin: 0 auto;">

                    </fieldset>
                </form>
            </div>
            <div id="contactMainDiv01RightSpan" class="contactTopSpans">
                <!-- <section>This is a place holder for the right div -->
                <!-- <div id="employeeDiv1" class="employeeDivs">
                        <img src="images/happyEmployee1.jpg" alt="Happy Employee 1"><p>John Smith, Accounting.</p>
                    </div>
                    <div id="employeeDiv2" class="employeeDivs"><img src="images/happyEmployee2.jpg" alt="Happy Employee 1"><p>Mr Bowel, Sales.</p></div>
                    <div id="employeeDiv3" class="employeeDivs"><img src="images/happyEmployee3.jpg" alt="Happy Employee 1"><p>Ms Chen, Admin.</p></div> -->

                <div id="employeeDiv1" class="employeeDivs">
                    <figure><img src="images/happy_employee1.jpg" alt="Happy Employee 1">
                        <figcaption>John Smith, Accounting</figcaption>
                    </figure>
                </div>
                <div id="employeeDiv2" class="employeeDivs">
                    <figure><img src="images/happy_employee2.jpg" alt="Happy Employee 1">
                        <figcaption>Mr Bowel, Sales.</figcaption>
                    </figure>
                </div>
                <div id="employeeDiv3" class="employeeDivs">
                    <figure><img src="images/happy_employee3.jpg" alt="Happy Employee 1">
                        <figcaption>Ms Chen, Admin.</figcaption>
                    </figure>
                </div>
            </div>

        </div>

        <div id="contactMainDiv02">
            <!-- <p>This is a contactMainDiv02</p> -->
